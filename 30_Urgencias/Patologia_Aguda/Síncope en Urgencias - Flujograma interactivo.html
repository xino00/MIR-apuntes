<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('flujo-datos').textContent);
  const N = D.nodos, G = D.guia, P = G.pasos;
  const root = document.documentElement;
  root.lang = 'es';
  const $ = s => document.querySelector(s);
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
  };
  const CAT = { 1: 'Urgente o vía específica', 2: 'Riesgo intermedio', 3: 'Decisión', 4: 'Bajo riesgo', 5: 'Valoración', 6: 'Detalle o evidencia' };
  const cat = n => n.tipo === 'file' ? 'Nota del vault' : (CAT[n.color] || 'Tarjeta');
  const kc = n => 'k' + (n.color || '0');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let enMarco = false;
  try { enMarco = window.top !== window.self; } catch (e) { enMarco = true; }

  /* ---------------- tema ---------------- */
  const temaBtn = $('#tema');
  const sysDark = matchMedia('(prefers-color-scheme: dark)');
  const temaActual = () => root.dataset.theme || (sysDark.matches ? 'dark' : 'light');
  const SOL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg>';
  const LUNA = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1z"/></svg>';
  const pintarTema = () => {
    const osc = temaActual() === 'dark';
    temaBtn.innerHTML = osc ? SOL : LUNA;
    temaBtn.setAttribute('aria-label', osc ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
    temaBtn.title = temaBtn.getAttribute('aria-label');
  };
  const temaGuardado = store.get('flujo-sincope-tema');
  if (temaGuardado === 'dark' || temaGuardado === 'light') root.dataset.theme = temaGuardado;
  temaBtn.addEventListener('click', () => {
    const t = temaActual() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = t; store.set('flujo-sincope-tema', t); pintarTema();
  });
  if (sysDark.addEventListener) sysDark.addEventListener('change', pintarTema);
  pintarTema();

  /* ---------------- vistas ---------------- */
  const secMapa = $('#vista-mapa'), secGuia = $('#vista-guiado');
  const segBtns = [...document.querySelectorAll('[data-vista]')];
  let vista = null;
  function ponerVista(v) {
    if (v !== 'mapa' && v !== 'guiado') v = 'guiado';
    if (v === vista) return;
    vista = v;
    document.body.dataset.vista = v;
    secMapa.hidden = v !== 'mapa';
    secGuia.hidden = v !== 'guiado';
    segBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === v)));
    store.set('flujo-sincope-vista', v);
    if (location.hash.slice(1) !== v) location.hash = v;
    if (v === 'mapa') mapa.asegurar();
  }
  segBtns.forEach(b => b.addEventListener('click', () => ponerVista(b.dataset.vista)));
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'mapa' || h === 'guiado') ponerVista(h); });

  /* ---------------- mapa ---------------- */
  const mapa = (() => {
    const lienzo = $('#lienzo'), mundo = $('#mundo'), svg = $('#aristas');
    const panel = $('#panel'), zoomVal = $('#zoom-val');
    const SIDE = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] };
    const PAD = 160;
    let OX = 0, OY = 0, W = 0, H = 0, listo = false;
    let s = 1, tx = 0, ty = 0;
    const elNodo = {}, elArista = {}, elEtiq = {};
    let sel = null, volverFoco = null;

    function construir() {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const n of [...Object.values(N), ...D.grupos]) {
        x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y - (n.etiqueta ? 70 : 0));
        x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h);
      }
      OX = PAD - x0; OY = PAD - y0; W = x1 - x0 + 2 * PAD; H = y1 - y0 + 2 * PAD;
      mundo.style.width = W + 'px'; mundo.style.height = H + 'px';
      svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      for (const g of D.grupos) {
        const d = mk('div', 'grp');
        Object.assign(d.style, { left: g.x + OX + 'px', top: g.y + OY + 'px', width: g.w + 'px', height: g.h + 'px' });
        const [cab, ...resto] = g.etiqueta.split(' — ');
        d.append(mk('div', 'grp-label', `<b>${esc(cab)}</b>${resto.length ? ' — ' + esc(resto.join(' — ')) : ''}`));
        mundo.append(d);
      }
      const ordenados = Object.values(N).sort((a, b) => a.y - b.y || a.x - b.x);
      for (const n of ordenados) {
        const d = mk('article', `node ${kc(n)} ${n.tipo === 'file' ? 'file' : 'tinted'}`);
        d.dataset.id = n.id; d.tabIndex = 0; d.setAttribute('role', 'button');
        d.setAttribute('aria-label', `${cat(n)}: ${n.titulo}`);
        Object.assign(d.style, { left: n.x + OX + 'px', top: n.y + OY + 'px', width: n.w + 'px', height: n.h + 'px' });
        if (n.tipo === 'file') {
          d.innerHTML = `<div class="file-kicker">Nota · ${esc(n.carpeta)}</div><h3>${esc(n.titulo)}</h3>` +
            (n.toc.length ? `<ul class="toc">${n.toc.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '<div class="toc"></div>') +
            `<a class="file-open" href="${esc(n.url)}" target="_blank" rel="noopener">Abrir nota ↗</a>`;
        } else {
          d.innerHTML = `<div class="md"><h${n.nivel}>${n.tituloHtml}</h${n.nivel}>${n.cuerpo}</div>`;
        }
        elNodo[n.id] = d; mundo.append(d);
      }
      const ns = 'http://www.w3.org/2000/svg';
      for (const e of D.aristas) {
        const geo = geometria(e);
        const g = document.createElementNS(ns, 'g');
        g.setAttribute('class', `edge k${e.color || '0'}${e.flecha ? '' : ' asoc'}`);
        const p = document.createElementNS(ns, 'path'); p.setAttribute('d', geo.d); g.append(p);
        if (geo.punta) { const t = document.createElementNS(ns, 'polygon'); t.setAttribute('points', geo.punta); g.append(t); }
        svg.append(g); elArista[e.id] = g;
        if (e.etiqueta) {
          const l = mk('div', `elab k${e.color || '0'}`); l.textContent = e.etiqueta; l.setAttribute('aria-hidden', 'true');
          l.style.left = geo.mid[0] + 'px'; l.style.top = geo.mid[1] + 'px';
          mundo.append(l); elEtiq[e.id] = l;
        }
      }
    }

    function lado(a, b) {
      const dx = (b.x + b.w / 2) - (a.x + a.w / 2), dy = (b.y + b.h / 2) - (a.y + a.h / 2);
      return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top');
    }
    function ancla(n, l) {
      const x = n.x + OX, y = n.y + OY;
      return l === 'top' ? [x + n.w / 2, y] : l === 'bottom' ? [x + n.w / 2, y + n.h] : l === 'left' ? [x, y + n.h / 2] : [x + n.w, y + n.h / 2];
    }
    function geometria(e) {
      const a = N[e.de], b = N[e.a];
      const la = e.ladoDe || lado(a, b), lb = e.ladoA || lado(b, a);
      const n1 = SIDE[la], n2 = SIDE[lb];
      const p1 = ancla(a, la), q = ancla(b, lb);
      const AL = e.flecha ? 18 : 0;
      const p2 = [q[0] + n2[0] * AL, q[1] + n2[1] * AL];
      const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const k = Math.max(40, Math.min(dist * 0.5, 220));
      const c1 = [p1[0] + n1[0] * k, p1[1] + n1[1] * k], c2 = [p2[0] + n2[0] * k, p2[1] + n2[1] * k];
      const bz = t => [0, 1].map(i => (1 - t) ** 3 * p1[i] + 3 * (1 - t) ** 2 * t * c1[i] + 3 * (1 - t) * t * t * c2[i] + t ** 3 * p2[i]);
      let punta = null;
      if (e.flecha) {
        const px = -n2[1], py = n2[0];
        punta = `${q[0]},${q[1]} ${p2[0] + px * 9},${p2[1] + py * 9} ${p2[0] - px * 9},${p2[1] - py * 9}`;
      }
      return { d: `M${p1[0]},${p1[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`, punta, mid: bz(0.5) };
    }

    function aplicar() {
      mundo.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
      let g = 24 * s; while (g < 12) g *= 4;
      lienzo.style.backgroundSize = `${g}px ${g}px`;
      lienzo.style.backgroundPosition = `${tx}px ${ty}px`;
      zoomVal.textContent = Math.round(s * 100) + ' %';
    }
    function ajusteTodo() {
      const r = lienzo.getBoundingClientRect();
      const ns = Math.min(r.width / W, r.height / H) * 0.96;
      return { s: ns, tx: (r.width - W * ns) / 2, ty: (r.height - H * ns) / 2 };
    }
    const limites = () => [Math.min(0.05, ajusteTodo().s * 0.8), 2.2];
    function zoomEn(px, py, f) {
      const [lo, hi] = limites();
      const ns = Math.min(hi, Math.max(lo, s * f));
      tx = px - (px - tx) * (ns / s); ty = py - (py - ty) * (ns / s); s = ns; aplicar();
    }
    let tAnim = 0;
    function animar(fn) {
      if (!reduced) { mundo.classList.add('anim'); clearTimeout(tAnim); tAnim = setTimeout(() => mundo.classList.remove('anim'), 340); }
      fn(); aplicar();
    }
    function verTodo() { const a = ajusteTodo(); animar(() => { s = a.s; tx = a.tx; ty = a.ty; }); }
    function verAncho() {
      const r = lienzo.getBoundingClientRect();
      animar(() => { s = Math.min(1, r.width / W); tx = (r.width - W * s) / 2; ty = 8; });
    }
    function centrar(id, minS = 0.62) {
      const n = N[id], r = lienzo.getBoundingClientRect();
      const movil = r.width < 760;
      const libre = panel.hidden || movil ? r.width : r.width - Math.min(500, r.width * 0.45);
      const alto = !panel.hidden && movil ? r.height * 0.26 : r.height;
      const ns = Math.min(Math.max(s, minS), (libre * 0.92) / n.w, (Math.max(alto, 180) * 0.92) / n.h, 1.4);
      const cx = n.x + OX + n.w / 2, cy = n.y + OY + n.h / 2;
      animar(() => {
        s = ns; tx = libre / 2 - cx * s; ty = alto / 2 - cy * s;
        if (alto < r.height) ty = Math.max(ty, 12 - (n.y + OY) * s);
      });
    }

    function marcarDesborde() {
      for (const n of Object.values(N)) {
        if (n.tipo === 'file') continue;
        const d = elNodo[n.id], md = d.firstElementChild;
        d.classList.toggle('clip', md.scrollHeight > md.clientHeight + 2);
      }
    }

    function limpiarSel() {
      lienzo.classList.remove('foco');
      for (const el of lienzo.querySelectorAll('.sel,.cerca,.hl')) el.classList.remove('sel', 'cerca', 'hl');
      sel = null;
    }
    function seleccionar(id, { abrir = true, centro = false } = {}) {
      limpiarSel();
      sel = id;
      lienzo.classList.add('foco');
      elNodo[id].classList.add('sel');
      for (const e of D.aristas) {
        if (e.de !== id && e.a !== id) continue;
        elArista[e.id].classList.add('hl'); if (elEtiq[e.id]) elEtiq[e.id].classList.add('hl');
        elNodo[e.de === id ? e.a : e.de].classList.add('cerca');
      }
      if (abrir) abrirPanel(id);
      if (centro) centrar(id);
    }
    function marcarRuta(camino) {
      for (const el of lienzo.querySelectorAll('.enruta')) el.classList.remove('enruta');
      if (!camino || !camino.length) { lienzo.classList.remove('ruta'); return; }
      const ids = new Set();
      camino.forEach(i => {
        ids.add(i);
        const p = P[i];
        if (p && p.paralelo && camino.includes(p.paralelo.siguiente)) p.paralelo.tareas.forEach(t => ids.add(t));
      });
      ids.forEach(i => elNodo[i] && elNodo[i].classList.add('enruta'));
      for (const e of D.aristas) {
        if (ids.has(e.de) && ids.has(e.a)) {
          elArista[e.id].classList.add('enruta'); if (elEtiq[e.id]) elEtiq[e.id].classList.add('enruta');
        }
      }
      lienzo.classList.add('ruta');
    }

    function abrirPanel(id) {
      const n = N[id];
      panel.className = `panel ${kc(n)}`;
      $('#panel-kicker').textContent = cat(n);
      $('#panel-titulo').innerHTML = n.tipo === 'file' ? esc(n.titulo) : n.tituloHtml;
      const cuerpo = $('#panel-cuerpo');
      cuerpo.innerHTML = '';
      if (n.tipo === 'file') {
        cuerpo.append(mk('div', 'md', `<p class="aviso">${esc(n.carpeta)}</p>` +
          (n.toc.length ? `<p><strong>Secciones</strong></p><ul>${n.toc.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '') +
          `<p><a class="btn prim" href="${esc(n.url)}" target="_blank" rel="noopener">Abrir nota ↗</a></p>`));
      } else {
        cuerpo.append(mk('div', 'md', n.cuerpo));
      }
      const conex = D.aristas.filter(e => e.de === id || e.a === id).sort((a, b) => (a.de === id) - (b.de === id));
      if (conex.length) {
        const sec = mk('div', 'panel-sec', '<h3>Conexiones</h3>');
        const lista = mk('div', 'conn');
        for (const e of conex) {
          const otro = N[e.de === id ? e.a : e.de];
          const b = mk('button', kc(otro));
          b.type = 'button';
          b.innerHTML = `<span class="dir">${e.de === id ? '→' : '←'}</span><span>${e.etiqueta ? `<span class="lab">${esc(e.etiqueta)}</span> · ` : ''}${esc(otro.titulo)}</span>`;
          b.addEventListener('click', () => { volverFoco = elNodo[otro.id]; seleccionar(otro.id, { centro: true }); });
          lista.append(b);
        }
        sec.append(lista); cuerpo.append(sec);
      }
      const dueno = P[id] ? id : G.dueno[id];
      if (dueno && G.camino[dueno]) {
        const sec = mk('div', 'panel-sec');
        const b = mk('button', 'btn prim', 'Seguir desde aquí en el recorrido guiado →');
        b.type = 'button';
        b.addEventListener('click', () => { guia.irA(G.camino[dueno].slice()); ponerVista('guiado'); });
        sec.append(b); cuerpo.append(sec);
      }
      cuerpo.scrollTop = 0;
      panel.hidden = false;
    }
    function cerrarPanel() {
      limpiarSel();
      if (panel.hidden) return;
      panel.hidden = true;
      if (volverFoco && document.contains(volverFoco)) volverFoco.focus({ preventScroll: true });
    }
    $('#panel-cerrar').addEventListener('click', cerrarPanel);

    /* gestos: arrastrar, pellizcar, rueda */
    const ptrs = new Map();
    let arr = null, pin = null, sinClick = false;
    const rect = () => lienzo.getBoundingClientRect();
    lienzo.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 1) arr = { id: e.pointerId, x: e.clientX, y: e.clientY, tx, ty, movido: false };
      else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()], r = rect();
        pin = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s, tx, ty, mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top };
        arr = null; sinClick = true;
        for (const id of ptrs.keys()) { try { lienzo.setPointerCapture(id); } catch (err) { /* puntero ya liberado */ } }
      }
    });
    lienzo.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pin && ptrs.size >= 2) {
        const [a, b] = [...ptrs.values()], r = rect();
        const [lo, hi] = limites();
        const ns = Math.min(hi, Math.max(lo, pin.s * Math.hypot(a.x - b.x, a.y - b.y) / pin.d));
        const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
        s = ns; tx = mx - (pin.mx - pin.tx) * (ns / pin.s); ty = my - (pin.my - pin.ty) * (ns / pin.s);
        aplicar(); return;
      }
      if (arr && arr.id === e.pointerId) {
        const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
        if (!arr.movido && Math.hypot(dx, dy) > 6) {
          arr.movido = true; lienzo.classList.add('arrastrando');
          try { lienzo.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
        }
        if (arr.movido) { tx = arr.tx + dx; ty = arr.ty + dy; aplicar(); }
      }
    });
    const soltar = e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pin = null;
      if (arr && arr.id === e.pointerId) { if (arr.movido) sinClick = true; arr = null; lienzo.classList.remove('arrastrando'); }
      if (ptrs.size === 1 && !arr) { const [[id, p]] = [...ptrs.entries()]; arr = { id, x: p.x, y: p.y, tx, ty, movido: true }; }
      if (sinClick && ptrs.size === 0) setTimeout(() => { sinClick = false; }, 0);
    };
    lienzo.addEventListener('pointerup', soltar);
    lienzo.addEventListener('pointercancel', soltar);
    const pista = $('.map-hint');
    const ocultarPista = () => { pista.hidden = true; };
    lienzo.addEventListener('pointerdown', ocultarPista, { once: true });
    lienzo.addEventListener('wheel', ocultarPista, { once: true, passive: true });
    // el foco de teclado desplazaría el lienzo (o una tarjeta) y descuadraría la transformación
    lienzo.addEventListener('scroll', e => { const t = e.target; if (t.scrollTop || t.scrollLeft) { t.scrollTop = 0; t.scrollLeft = 0; } }, true);
    lienzo.addEventListener('click', e => {
      if (sinClick) { e.preventDefault(); e.stopPropagation(); sinClick = false; return; }
      if (e.target.closest('a')) return;
      const nd = e.target.closest('.node');
      if (nd) { volverFoco = nd; seleccionar(nd.dataset.id); } else cerrarPanel();
    }, true);
    lienzo.addEventListener('wheel', e => {
      e.preventDefault();
      let dx = e.deltaX, dy = e.deltaY;
      if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
      const r = rect();
      if (e.ctrlKey || e.metaKey) zoomEn(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * (Math.abs(dy) < 40 ? 0.012 : 0.0022)));
      else { if (e.shiftKey && !dx) { dx = dy; dy = 0; } tx -= dx; ty -= dy; aplicar(); }
    }, { passive: false });
    lienzo.addEventListener('keydown', e => {
      const nd = e.target.closest && e.target.closest('.node');
      if (nd && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); volverFoco = nd; seleccionar(nd.dataset.id, { centro: true }); return; }
      const r = rect(), paso = 80;
      const acc = { ArrowLeft: () => { tx += paso; }, ArrowRight: () => { tx -= paso; }, ArrowUp: () => { ty += paso; }, ArrowDown: () => { ty -= paso; } }[e.key];
      if (acc) { e.preventDefault(); acc(); aplicar(); return; }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomEn(r.width / 2, r.height / 2, 1.25); }
      else if (e.key === '-') { e.preventDefault(); zoomEn(r.width / 2, r.height / 2, 0.8); }
      else if (e.key === '0') { e.preventDefault(); verTodo(); }
    });
    lienzo.addEventListener('focusin', e => {
      const nd = e.target.closest('.node');
      if (nd && nd.matches(':focus-visible')) {
        const n = N[nd.dataset.id], r = rect();
        const x = (n.x + OX) * s + tx, y = (n.y + OY) * s + ty;
        if (x < 0 || y < 0 || x + n.w * s > r.width || y + n.h * s > r.height || s < 0.45) centrar(n.id, 0.6);
      }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && vista === 'mapa') cerrarPanel(); });
    const centroZoom = f => { const r = rect(); zoomEn(r.width / 2, r.height / 2, f); };
    $('#z-mas').addEventListener('click', () => centroZoom(1.3));
    $('#z-menos').addEventListener('click', () => centroZoom(1 / 1.3));
    $('#z-todo').addEventListener('click', verTodo);
    $('#z-ancho').addEventListener('click', verAncho);

    return {
      asegurar() {
        if (listo) return;
        construir(); listo = true;
        const r = rect(); s = Math.min(1, r.width / W); tx = (r.width - W * s) / 2; ty = 8; aplicar();
        marcarDesborde();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(marcarDesborde);
      },
      mostrar(camino, id) {
        this.asegurar();
        cerrarPanel();
        marcarRuta(camino);
        if (id) requestAnimationFrame(() => centrar(id, 0.55));
      }
    };
  })();

  /* ---------------- recorrido guiado ---------------- */
  const guia = (() => {
    const stepEl = $('#step'), crumbs = $('#crumbs'), extra = $('#g-extra');
    let camino = [G.inicio];

    const chip = id => {
      const n = N[id];
      return `<a class="note-chip" href="${esc(n.url)}" target="_blank" rel="noopener"><small>${esc(n.carpeta)}</small><span>${esc(n.titulo)} ↗</span></a>`;
    };
    const notasHtml = ids => ids.length ? `<div class="notes">${ids.map(chip).join('')}</div>` : '';
    const acordeon = (id, extraHtml = '') => {
      const n = N[id];
      return `<details class="acc ${kc(n)}"><summary>${n.tituloHtml}</summary><div class="acc-body"><div class="md">${n.cuerpo}</div>${extraHtml}</div></details>`;
    };
    const eleccion = (etiqueta, destino) => {
      const n = N[destino];
      return `<button type="button" class="choice ${kc(n)}" data-ir="${destino}"><span class="lab">${esc(etiqueta)} →</span><span class="tgt">${esc(n.titulo)}</span></button>`;
    };

    function intro() {
      const cab = N[G.cabecera];
      if (cab) {
        $('#g-intro').innerHTML = '<p class="aviso">Material educativo: no sustituye al protocolo local ni al juicio clínico. En cada paso, pulsa la opción que corresponda; las tarjetas moradas amplían el detalle.</p>' +
          `<details class="acc k6"><summary>Fuentes, leyenda y notas del grupo síncope</summary><div class="acc-body"><div class="md">${cab.cuerpo}</div>` +
          (G.notasCabecera.length ? `<div class="sec"><h3>Notas del grupo síncope</h3>${notasHtml(G.notasCabecera)}</div>` : '') +
          '</div></details>';
      }
      if (N[G.pie]) $('#g-pie').innerHTML = acordeon(G.pie);
    }

    function pintar(enfocar) {
      const id = camino[camino.length - 1], n = N[id], p = P[id];
      crumbs.innerHTML = camino.map((c, i) => `${i ? '<span class="sep" aria-hidden="true">›</span>' : ''}<button type="button" class="${kc(N[c])} tinted" data-paso="${i}" title="${esc(N[c].titulo)}"${i === camino.length - 1 ? ' aria-current="step"' : ''}>${esc(N[c].corto)}</button>`).join('');
      crumbs.scrollLeft = crumbs.scrollWidth;
      stepEl.className = `step tinted ${kc(n)}`;
      let h = `<div class="step-meta"><span>${esc(cat(n))}</span><span class="n">Paso ${camino.length}</span></div>` +
        `<h2 tabindex="-1">${n.tituloHtml}</h2><div class="md">${n.cuerpo}</div>`;
      if (p.paralelo) {
        h += `<div class="sec"><div class="sec-head"><h3>${esc(p.paralelo.etiqueta)}: ${p.paralelo.tareas.length} tareas</h3><button type="button" class="btn" data-abrir-todo>Desplegar todas</button></div>` +
          p.paralelo.tareas.map(t => acordeon(t, notasHtml(P[t] ? P[t].notas : []) + (P[t] ? P[t].detalles.map(x => acordeon(x)).join('') : ''))).join('') + '</div>' +
          `<div class="choices">${eleccion('Siguiente', p.paralelo.siguiente)}</div>`;
      } else if (p.siguiente) {
        h += `<div class="choices">${eleccion('Siguiente', p.siguiente)}</div>`;
      } else if (p.ramas.length) {
        h += `<p class="choices-h">Elige la opción que corresponda</p><div class="choices${p.ramas.length > 1 ? ' multi' : ''}">${p.ramas.map(r => eleccion(r.etiqueta, r.a)).join('')}</div>`;
      } else {
        h += '<p class="fin">Fin de esta rama del flujograma. Revisa las notas enlazadas y el apartado «Antes de cerrar».</p>';
      }
      stepEl.innerHTML = h;
      let x = '';
      if (p.detalles.length) x += `<section class="sec"><h3>Para saber más</h3>${p.detalles.map(d => acordeon(d)).join('')}</section>`;
      if (p.notas.length) x += `<section class="sec"><h3>Notas relacionadas</h3>${notasHtml(p.notas)}</section>`;
      if (p.final && G.cierre.length) x += `<section class="sec"><h3>Antes de cerrar</h3>${G.cierre.map(c => acordeon(c)).join('')}</section>`;
      extra.innerHTML = x;
      extra.hidden = !x;
      $('#g-atras').disabled = camino.length < 2;
      if (enfocar) {
        const top = crumbs.getBoundingClientRect().top + scrollY - 70;
        if (scrollY > top) scrollTo({ top: Math.max(0, top), behavior: reduced ? 'auto' : 'smooth' });
        stepEl.querySelector('h2').focus({ preventScroll: true });
      }
    }

    function guardarHist(reemplazar) {
      if (enMarco) return;
      try {
        if (reemplazar) history.replaceState({ camino: camino.slice() }, '', location.href);
        else history.pushState({ camino: camino.slice() }, '', '#guiado');
      } catch (e) { /* sin historial */ }
    }
    function ir(destino) { camino.push(destino); guardarHist(false); pintar(true); }

    stepEl.addEventListener('click', e => {
      const b = e.target.closest('[data-ir]');
      if (b) { ir(b.dataset.ir); return; }
      const t = e.target.closest('[data-abrir-todo]');
      if (t) {
        const acc = [...stepEl.querySelectorAll('.sec > .acc')];
        const abrir = acc.some(a => !a.open);
        acc.forEach(a => { a.open = abrir; });
        t.textContent = abrir ? 'Plegar todas' : 'Desplegar todas';
      }
    });
    crumbs.addEventListener('click', e => {
      const b = e.target.closest('[data-paso]');
      if (!b) return;
      const i = +b.dataset.paso;
      if (i === camino.length - 1) return;
      camino = camino.slice(0, i + 1); guardarHist(false); pintar(true);
    });
    $('#g-atras').addEventListener('click', () => { if (camino.length > 1) { camino.pop(); guardarHist(false); pintar(true); } });
    $('#g-reinicio').addEventListener('click', () => { camino = [G.inicio]; guardarHist(false); pintar(true); });
    $('#g-mapa').addEventListener('click', () => { ponerVista('mapa'); mapa.mostrar(camino, camino[camino.length - 1]); });
    addEventListener('popstate', e => {
      if (e.state && Array.isArray(e.state.camino) && e.state.camino.every(c => P[c])) {
        camino = e.state.camino.slice(); pintar(false);
      }
    });

    intro(); pintar(false);
    if (!(history.state && history.state.camino)) guardarHist(true);
    else if (history.state.camino.every(c => P[c])) { camino = history.state.camino.slice(); pintar(false); }
    return { irA(c) { camino = c; guardarHist(false); pintar(false); scrollTo(0, 0); } };
  })();

  /* ---------------- arranque ---------------- */
  const h0 = location.hash.slice(1);
  const v0 = (h0 === 'mapa' || h0 === 'guiado') ? h0 : (store.get('flujo-sincope-vista') || (innerWidth < 760 ? 'guiado' : 'mapa'));
  ponerVista(v0);
})();
</script>
</body>
